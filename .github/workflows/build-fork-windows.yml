name: Build fork (Windows)

# 仅用于在 fork 里出 Windows 构建产物，不发布 Release、不签名更新包。
on:
  workflow_dispatch:
  push:
    branches:
      - "build/**"

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/claude-mom/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        working-directory: apps/claude-mom
        run: npm ci

      - name: 构建
        working-directory: apps/claude-mom
        run: npm run tauri -- build

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/claude-mom.exe dist/ClaudeMom-fork.exe
          for f in target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" dist/ || true
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMom-fork-windows
          path: dist/*
          if-no-files-found: error
